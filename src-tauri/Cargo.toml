[package]
name = "mypinboard"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "MyPinboard — glass clipboard pinboard and file shelf for Windows"
default-run = "mypinboard"

[lib]
name = "mypinboard_lib"
crate-type = ["rlib"]

[[bin]]
name = "mypinboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pinboard-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
window-vibrancy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["monitor", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_DataExchange",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse",
] }
